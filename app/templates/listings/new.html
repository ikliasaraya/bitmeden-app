<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yeni Listeleme - Bitmeden</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a href="{{ url_for('dashboard.index') }}" class="navbar-brand">← Bitmeden</a>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light btn-sm">Çıkış Yap</a>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-4">Yeni Listeleme Oluştur</h2>

    <form method="POST" class="col-md-6">
      <div class="mb-3">
        <label class="form-label">Ürün</label>
        <select name="product_id" class="form-select">
          {% for product in products %}
            <option value="{{ product.id }}">{{ product.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Tür</label>
        <select name="type" class="form-select">
          <option value="surplus">Elde Kalan Ürün</option>
          <option value="campaign">Kampanya</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">İndirimli Fiyat (TL)</label>
        <input type="number" name="discounted_price" class="form-control" step="0.01" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Adet</label>
        <input type="number" name="quantity_available" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Başlangıç</label>
        <input type="datetime-local" name="start_time" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Bitiş</label>
        <input type="datetime-local" name="end_time" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary">Yayınla</button>
      <a href="{{ url_for('listings.listings') }}" class="btn btn-link">Vazgeç</a>
    </form>
  </div>

</body>
</html>
