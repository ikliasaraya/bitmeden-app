<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel - Bitmeden</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Bitmeden</span>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light btn-sm">Çıkış Yap</a>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-4">Merhaba, {{ current_user.name }} 👋</h2>

    <div class="row g-3">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Ürünler</h5>
            <p class="card-text text-muted">Ürün kataloğunu yönet.</p>
            <a href="{{ url_for('products.products') }}" class="btn btn-outline-primary btn-sm">Görüntüle</a>
            <a href="{{ url_for('products.add_product') }}" class="btn btn-primary btn-sm">+ Ürün Ekle</a>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Listelemeler</h5>
            <p class="card-text text-muted">Günlük indirim/kampanya yayınla.</p>
            <a href="{{ url_for('listings.listings') }}" class="btn btn-outline-primary btn-sm">Görüntüle</a>
            <a href="{{ url_for('listings.add_listings') }}" class="btn btn-primary btn-sm">+ Listeleme Oluştur</a>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
