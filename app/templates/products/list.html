<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ürünler - Bitmeden</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a href="{{ url_for('dashboard.index') }}" class="navbar-brand">← Bitmeden</a>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light btn-sm">Çıkış Yap</a>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Ürünlerim</h2>
      <a href="{{ url_for('products.add_product') }}" class="btn btn-primary">+ Yeni Ürün</a>
    </div>

    {% if not products %}
      <p class="text-muted">Henüz ürün eklemedin.</p>
    {% else %}
    <div class="row g-3">
      {% for product in products %}
      <div class="col-md-4">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">{{ product.name }}</h5>
            <p class="card-text text-muted">{{ product.description or "" }}</p>
            <p class="fw-bold">{{ product.base_price }} TL</p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
    {% endif %}
  </div>

</body>
</html>
