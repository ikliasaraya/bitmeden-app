<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yeni Ürün - Bitmeden</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a href="{{ url_for('dashboard.index') }}" class="navbar-brand">← Bitmeden</a>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light btn-sm">Çıkış Yap</a>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-4">Yeni Ürün Ekle</h2>

    <form method="POST" class="col-md-6">
      <div class="mb-3">
        <label class="form-label">Ürün Adı</label>
        <input type="text" name="name" class="form-control" placeholder="Ürün adı" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Açıklama</label>
        <input type="text" name="description" class="form-control" placeholder="Ürün Açıklaması" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Normal Fiyat (TL)</label>
        <input type="number" name="base_price" class="form-control" step="0.01" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Görsel Linki</label>
        <input type="text" name="photo_url" class="form-control" placeholder="Görsel Linki">
      </div>
      <button type="submit" class="btn btn-primary">Ürün Ekle</button>
      <a href="{{ url_for('products.products') }}" class="btn btn-link">Vazgeç</a>
    </form>
  </div>

</body>
</html>
